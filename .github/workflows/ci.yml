name: CI

# Checks only. Deploy is done by Cloudflare Git Integration on push to main,
# so this workflow never runs `wrangler deploy`.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # `pnpm check` (tsc) is blocking; `pnpm build`, then `pnpm e2e` in its own
  # job (build FE, schema D1 local, SSO/Odoo gia + wrangler dev).
  check:
    uses: nguyenhuy158/kit/.github/workflows/check.yml@v0.1.0
    with:
      run-build: true
      run-e2e: true
