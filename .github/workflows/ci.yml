name: CI

# Checks only. Deploy is done by Cloudflare Git Integration on push to main,
# so this workflow never runs `wrangler deploy`.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Report-only: client/src/App.tsx is still largely untyped and has known
      # type errors. Make this blocking once `pnpm check` is clean.
      - name: Typecheck (report-only)
        run: pnpm check
        continue-on-error: true

      - name: Build
        run: pnpm build
